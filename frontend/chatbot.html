<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Chatbot - Self Study</title>
<link rel="stylesheet" href="style.css">

<style>

/* Chat Card */
.chat-card {
    background: rgba(255,255,255,0.05);
    padding: 25px;
    border-radius: 15px;
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    height: 70vh;
}

/* Chat Window */
.chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    margin-bottom: 15px;
}

/* Message Bubbles */
.message {
    margin-bottom: 15px;
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    position: relative;
}

.user {
    background: #2563eb;
    align-self: flex-end;
}

.ai {
    background: #374151;
    align-self: flex-start;
}

.timestamp {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 4px;
}

/* Input Area */
.input-area {
    display: flex;
    gap: 10px;
}

.input-area input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

.send-btn {
    background: #22c55e;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    color: white;
}

.send-btn:hover {
    background: #16a34a;
}

.top-actions {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.secondary-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    background: #6b7280;
    color: white;
    cursor: pointer;
}

.secondary-btn:hover {
    background: #4b5563;
}

.typing {
    font-size: 13px;
    opacity: 0.6;
}

/* Code blocks in AI replies */
.message pre {
    background: #111827;
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 13px;
}

.message code {
    font-family: "Consolas", "Monaco", monospace;
}

.message p.inline-code, .message :not(pre) > code {
    background: rgba(255,255,255,0.12);
    padding: 2px 5px;
    border-radius: 4px;
}

.mermaid-wrap {
    background: white;
    border-radius: 8px;
    padding: 12px;
    margin: 8px 0;
    overflow-x: auto;
}

/* Markdown tables in AI replies */
.message table.md-table {
    border-collapse: collapse;
    width: 100%;
    margin: 10px 0;
    font-size: 13px;
}

.message table.md-table th,
.message table.md-table td {
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 10px;
    text-align: left;
}

.message table.md-table th {
    background: rgba(255,255,255,0.1);
    font-weight: 600;
}

.message table.md-table tr:nth-child(even) td {
    background: rgba(255,255,255,0.03);
}

</style>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
</head>

<body>

<script>
if(!sessionStorage.getItem("userId")){
    window.location.href = "login.html";
}
</script>

<div class="sidebar">
    <div>
        <div class="sidebar-header">
            <div class="dashboard-btn" onclick="goDashboard()">☰</div>
            <h2>HOME</h2>
        </div>

        <ul>
            <li onclick="location.href='materials.html'">Materials</li>
            <li class="active">AI Chatbot</li>
            <li onclick="location.href='summariser.html'">AI Summariser</li>
            <li onclick="location.href='smartquiz.html'">AI Smart Quiz</li>
            <li onclick="location.href='timetable.html'">Timetable</li>
            <li onclick="location.href='assignments.html'">Assignment Tracker</li>
            <li onclick="location.href='grades.html'">Grades</li>
            <li onclick="location.href='progress.html'">Progress Tracker</li>
        </ul>
    </div>

    <div class="logout" onclick="logout()">Logout</div>
</div>

<div class="main">

<div class="header">
    <div style="display:flex;align-items:center;">
        <img src="logo.jpeg" class="logo">
        <h1>Self Study</h1>
    </div>
</div>

<div class="chat-card">

<div class="top-actions">
    <h2>AI Study Assistant</h2>
    <div>
        <button class="secondary-btn" onclick="clearChat()">Clear</button>
        <button class="secondary-btn" onclick="exportChat()">Export</button>
    </div>
</div>

<div class="chat-window" id="chatWindow"></div>

<div class="typing" id="typingIndicator" style="display:none;">
AI is typing...
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">Send</button>
</div>

</div>
</div>

<script>

let chatHistory = JSON.parse(localStorage.getItem("chatHistory")) || [];

const chatWindow = document.getElementById("chatWindow");

// Mermaid renders any element with class="mermaid" it finds - configure it
// once, then re-run it after inserting new AI messages that contain diagrams.
if (typeof mermaid !== "undefined") {
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
}

function renderChat(){
    chatWindow.innerHTML="";
    chatHistory.forEach(msg=>{
        appendMessage(msg.text, msg.type, msg.time);
    });
}

function escapeHtml(str){
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

// ---- Markdown table support ----

function isTableSeparatorLine(line){
    const t = line.trim();
    if (!t.includes("-")) return false;
    return /^[:\-|\s]+$/.test(t);
}

function splitTableRow(line){
    let t = line.trim();
    if (t.startsWith("|")) t = t.slice(1);
    if (t.endsWith("|")) t = t.slice(0, -1);
    return t.split("|").map(c => c.trim());
}

function isTableRow(line){
    const t = line.trim();
    if (!t.includes("|")) return false;
    return splitTableRow(t).length >= 2;
}

// Applies inline code + bold formatting to a single already-HTML-escaped line/cell.
function inlineFormat(text){
    return text
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

function renderTable(headerLine, bodyLines){
    const headers = splitTableRow(headerLine);
    let html = `<table class="md-table"><thead><tr>`;
    headers.forEach(h => html += `<th>${inlineFormat(h)}</th>`);
    html += `</tr></thead><tbody>`;
    bodyLines.forEach(row => {
        const cells = splitTableRow(row);
        html += `<tr>`;
        cells.forEach(c => html += `<td>${inlineFormat(c)}</td>`);
        html += `</tr>`;
    });
    html += `</tbody></table>`;
    return html;
}

// Formats a plain-text (non-code-fence) segment: detects markdown tables
// line-by-line and renders them as real <table> elements, and applies
// inline code/bold formatting + line breaks to everything else.
function formatTextSegment(rawText){
    const escaped = escapeHtml(rawText);
    const lines = escaped.split("\n");
    let html = "";
    let i = 0;

    while (i < lines.length) {
        // A table is: a header row, then a separator row (---|---|---), then 1+ data rows
        if (isTableRow(lines[i]) && i + 1 < lines.length && isTableSeparatorLine(lines[i + 1])) {
            const headerLine = lines[i];
            let j = i + 2;
            const bodyRows = [];
            while (j < lines.length && isTableRow(lines[j])) {
                bodyRows.push(lines[j]);
                j++;
            }
            html += renderTable(headerLine, bodyRows);
            i = j;
        } else {
            html += inlineFormat(lines[i]) + "<br>";
            i++;
        }
    }

    return html;
}

// Turns fenced ```code``` blocks (including ```mermaid diagrams), markdown
// tables, inline `code`, and **bold** text into real HTML so AI replies
// actually render instead of showing raw markdown symbols.
function formatAiText(text){
    const parts = String(text).split(/```/);
    let html = "";

    parts.forEach((part, i) => {
        if (i % 2 === 1) {
            // Fenced block - first line may be a language tag
            const lines = part.split("\n");
            const lang = lines[0].trim().toLowerCase();
            const code = (lang && lines.length > 1) ? lines.slice(1).join("\n") : part;

            if (lang === "mermaid") {
                html += `<div class="mermaid-wrap"><div class="mermaid">${escapeHtml(code.trim())}</div></div>`;
            } else {
                html += `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
            }
        } else {
            html += formatTextSegment(part);
        }
    });

    return html;
}

function appendMessage(text, type, time){
    const msgDiv = document.createElement("div");
    msgDiv.classList.add("message", type);

    const body = (type === "ai") ? formatAiText(text) : escapeHtml(text).replace(/\n/g, "<br>");
    msgDiv.innerHTML = body + `<div class="timestamp">${time}</div>`;
    chatWindow.appendChild(msgDiv);
    chatWindow.scrollTop = chatWindow.scrollHeight;

    // Render any Mermaid diagrams that were just added
    if (type === "ai" && typeof mermaid !== "undefined") {
        const diagrams = msgDiv.querySelectorAll(".mermaid");
        if (diagrams.length) {
            mermaid.run({ nodes: diagrams }).catch(err => console.error("Mermaid render error:", err));
        }
    }
}

function sendMessage() {

    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if(!text) return;

    const time = new Date().toLocaleTimeString();

    chatHistory.push({text, type:"user", time});
    localStorage.setItem("chatHistory", JSON.stringify(chatHistory));

    renderChat();
    input.value="";

    document.getElementById("typingIndicator").style.display="block";

    // Send the recent conversation along with the new message so the AI
    // can follow up on earlier questions instead of treating each one in isolation.
    const recentHistory = chatHistory
        .slice(0, -1) // exclude the message we just pushed above, it's sent separately
        .slice(-10)
        .map(m => ({ role: m.type === "ai" ? "ai" : "user", content: m.text }));

    fetch(`${API_BASE}/api/chat`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: text, history: recentHistory })
    })
    .then(res => res.json())
    .then(data => {

        const aiTime = new Date().toLocaleTimeString();

        chatHistory.push({
            text: data.reply,
            type:"ai",
            time: aiTime
        });

        localStorage.setItem("chatHistory", JSON.stringify(chatHistory));
        document.getElementById("typingIndicator").style.display="none";
        renderChat();
    })
    .catch(err => {
        console.error(err);
        document.getElementById("typingIndicator").style.display="none";
    });
}

function clearChat(){
    chatHistory=[];
    localStorage.removeItem("chatHistory");
    renderChat();
}

function exportChat(){
    let text="";
    chatHistory.forEach(msg=>{
        text += `${msg.type.toUpperCase()} (${msg.time}): ${msg.text}\n\n`;
    });
    const blob = new Blob([text], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "chat_history.txt";
    link.click();
}

function goDashboard(){
    window.location.href="index.html";
}

function logout(){
    sessionStorage.removeItem("userId");
    window.location.href="login.html";
}

renderChat();

</script>

</body>
</html>
